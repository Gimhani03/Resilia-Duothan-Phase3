# Full production stack — RESILIA Phase 3
# Usage: docker compose -f docker-compose.prod.yml up --build
#
# Web (nginx + SPA):  http://localhost:8080
# API direct:         http://localhost:3001/api/health
# Ops console:        http://localhost:8080/ops/signin

services:
  postgres:
    image: postgres:16-alpine
    container_name: resilia-postgres
    environment:
      POSTGRES_USER: resilia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resilia}
      POSTGRES_DB: resilia
    volumes:
      - resilia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilia -d resilia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: resilia-redis
    command: redis-server --appendonly yes
    volumes:
      - resilia_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resilia-api
    environment:
      DATABASE_URL: postgresql://resilia:${POSTGRES_PASSWORD:-resilia}@postgres:5432/resilia
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-${JWT_SECRET}}
      PORT: "3001"
      NODE_ENV: production
      DEMO_MODE: ${DEMO_MODE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_ON_START: ${SEED_ON_START:-true}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DEPLOY_REGION: ${DEPLOY_REGION:-local}
      UPLOAD_DIR: /app/apps/api/uploads
    volumes:
      - resilia_uploads:/app/apps/api/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: resilia-web
    environment:
      API_UPSTREAM: http://api:3001
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  resilia_pg:
  resilia_redis:
  resilia_uploads:
