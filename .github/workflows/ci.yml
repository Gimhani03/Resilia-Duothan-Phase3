name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resilia
          POSTGRES_PASSWORD: resilia
          POSTGRES_DB: resilia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resilia -d resilia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build shared
        run: npm run build -w @resilia/shared
      - name: Prisma generate + validate
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://resilia:resilia@localhost:5432/resilia"
        run: |
          npx prisma generate
          npx prisma validate
      - name: Build API
        run: npm run build -w @resilia/api
        env:
          DATABASE_URL: "postgresql://resilia:resilia@localhost:5432/resilia"
          JWT_SECRET: ci-secret-minimum-32-characters-long
          DEMO_MODE: "false"
      - name: Typecheck mobile
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Build web
        run: npm run build -w @resilia/web

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: resilia-api:ci
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: resilia-web:ci
