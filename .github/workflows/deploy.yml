name: deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/api:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/api:${{ steps.meta.outputs.sha }}

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/web:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/web:${{ steps.meta.outputs.sha }}

      - name: Deploy summary
        run: |
          echo "## RESILIA deploy artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/api:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: \`${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}/web:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull on your VM or connect Render/Railway to this repo for auto-deploy." >> "$GITHUB_STEP_SUMMARY"
