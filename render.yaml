# RESILIA — Render.com blueprint (Phase 3 IaC)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: resilia-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resilia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: resilia-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: APP_VERSION
        value: "0.1.0"
      - key: DEPLOY_REGION
        value: render

  - type: web
    name: resilia-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: API_UPSTREAM
        sync: false

  - type: keyvalue
    name: resilia-redis
    plan: starter
    ipAllowList: []

databases:
  - name: resilia-db
    plan: starter
    databaseName: resilia
    user: resilia
